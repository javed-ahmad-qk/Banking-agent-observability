[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "banking-agent-observability"
version = "1.0.0"
description = "A production-minded Google ADK banking agent with RAG, durable sessions, OpenTelemetry, Arize AX tracing, and multi-scope evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Banking Agent Observability Project" }]
dependencies = [
  "google-adk>=1.22.0,<2.0.0",
  "aiosqlite>=0.21.0,<1.0.0",
  "google-genai>=1.30.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "arize-otel>=0.9.0,<1.0.0",
  "openinference-instrumentation-google-adk>=0.1.0,<1.0.0",
  "opentelemetry-sdk>=1.30.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "httpx>=0.28.0", "ruff>=0.9.0"]

[project.scripts]
banking-agent = "banking_agent.cli:main"
banking-eval = "banking_agent.evaluation.cli:main"
banking-eval-set = "banking_agent.evaluation.dataset_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_agent"]

[tool.hatch.build.targets.wheel.force-include]
"data/policies" = "banking_agent/policies"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
