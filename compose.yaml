services:
  banking-agent:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/runtime/banking_agent.sqlite3
      ADK_SESSIONS_DB_PATH: /app/runtime/adk_sessions.sqlite3
      POLICY_DATA_DIR: /app/data/policies
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - banking-data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  banking-data:
